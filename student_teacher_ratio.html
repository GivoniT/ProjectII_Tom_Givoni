<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Student–Teacher Ratio Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Playfair+Display:wght@400;600;700&family=Work+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/vega@5.27.0/build/vega.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.19.0/build/vega-lite.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.26.0/build/vega-embed.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        font-family: "Work Sans", "Helvetica Neue", Arial, sans-serif;
        --font-heading: "Playfair Display", "Times New Roman", serif;
        --font-body: "Work Sans", "Helvetica Neue", Arial, sans-serif;
        --font-accent: "Montserrat", "Work Sans", sans-serif;
        --title-1: #780000;
        --title-2: #c1121f;
        --background: #fdf0d5;
        --text-1: #003049;
        --text-2: #669bbc;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 32px 16px 64px;
        gap: 24px;
        box-sizing: border-box;
        background: var(--background);
        color: var(--text-1);
        font-family: var(--font-body);
        letter-spacing: 0.01em;
      }

      header {
        max-width: 960px;
        width: 100%;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: 32px;
        font-weight: 700;
        color: var(--title-1);
        font-family: var(--font-heading);
        letter-spacing: 0.02em;
      }

      p {
        margin: 12px auto 0;
        max-width: 720px;
        color: var(--text-1);
        line-height: 1.6;
        font-family: var(--font-body);
        letter-spacing: 0.01em;
      }

      .card {
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 12px 32px rgba(0, 48, 73, 0.25);
        padding: 24px;
        max-width: 960px;
        width: 100%;
        box-sizing: border-box;
      }

      .viz {
        width: 100%;
        min-height: 440px;
      }

      .controls {
        margin-top: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
      }

      .controls label {
        font-weight: 600;
        color: var(--title-1);
        font-family: var(--font-accent);
        letter-spacing: 0.04em;
      }

      .controls input[type="range"] {
        width: 220px;
      }

      .controls output {
        font-weight: 600;
        color: var(--title-2);
        min-width: 3ch;
        text-align: right;
        font-family: var(--font-accent);
        letter-spacing: 0.03em;
      }

      .back-link {
        text-decoration: none;
        color: var(--text-1);
        font-weight: 600;
        font-family: var(--font-accent);
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <header>
      <a class="back-link" href="index.html">← Back to dashboard</a>
      <h1>Student–Teacher Ratio Explorer</h1>
      <p>
        Compare student-to-teacher ratios across Australian states and sectors.
        Use the year slider and school-level selector embedded in the chart to
        see how staffing levels differ for primary and secondary schools.
      </p>
    </header>

    <main class="card">
      <div
        id="student-teacher-chart"
        class="viz"
        aria-label="Grouped bar chart showing student to teacher ratios by state and sector"
      ></div>
      <div class="controls">
        <label for="ratioYearSlider">Year</label>
        <input id="ratioYearSlider" type="range" min="2006" max="2024" step="1" value="2024" />
        <output id="ratioYearValue">2024</output>
      </div>
    </main>

    <script>
      vegaEmbed("#student-teacher-chart", "student_teacher_ratio_chart.json", {
        renderer: "canvas",
        actions: {
          exporter: true,
          source: false,
          compiled: false,
          editor: true
        }
      })
        .then((result) => {
          const view = result.view;
          const slider = document.getElementById("ratioYearSlider");
          const output = document.getElementById("ratioYearValue");

          const applyYear = (year) => {
            if (!Number.isFinite(year)) return;
            if (output) {
              output.textContent = String(year);
            }
            view.signal("ratioYear", year);
            view.runAsync();
          };

          const initialYear = view.signal("ratioYear") || 2024;
          applyYear(initialYear);

          if (slider) {
            slider.value = initialYear;
            slider.addEventListener("input", (event) => {
              applyYear(Number(event.target.value));
            });
          }
        })
        .catch((error) => {
          console.error("Unable to load student-teacher ratio chart:", error);
        });
    </script>
  </body>
</html>
